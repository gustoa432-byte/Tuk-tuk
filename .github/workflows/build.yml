name: Build TukTuk82
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Setup local.properties
        run: echo "VK_ACCESS_TOKEN=${{ secrets.VK_ACCESS_TOKEN }}" > local.properties
      - name: Build APK
        run: gradle assembleDebug
        # Release/reproducible notes: docs/REPRODUCIBLE_BUILDS.md (epoch via -Preproducible.apk.epoch=)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukTuk82-APK
          path: app/build/outputs/apk/debug/*.apk
